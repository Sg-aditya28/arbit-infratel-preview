<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Azure Brand Gradient -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56ACF8" />
      <stop offset="50%" stop-color="#2C8FEA" />
      <stop offset="100%" stop-color="#1A6FC4" />
    </linearGradient>

    <!-- Solar Gold Spire Gradient -->
    <linearGradient id="goldSpireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="spireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A1128" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Shield -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0B131E" stroke="#2C8FEA" stroke-width="2.5" stroke-opacity="0.6" filter="url(#cardShadow)" />

  <!-- Subtle Internal Architectural Grid Line -->
  <line x1="20" y1="94" x2="108" y2="94" stroke="#2C8FEA" stroke-width="1" stroke-opacity="0.25" />

  <!-- Geometric Architectural 'a' -->
  <path d="M 32 60 C 32 46 44 38 60 38 C 74 38 82 45 82 58 L 82 92 L 68 92 L 68 85 C 64 91 56 94 48 94 C 36 94 28 85 28 73 C 28 59 39 52 66 51 L 68 51 L 68 49 C 68 44 63 42 56 42 C 48 42 43 45 42 50 Z M 68 62 C 48 63 42 66 42 74 C 42 80 47 84 54 84 C 62 84 68 79 68 71 Z" fill="url(#azureGrad)" />

  <!-- Iconic Upward-Pointing Ascending Spire / Arrow above letter 'i' -->
  <polygon points="98,18 72,56 102,48" fill="url(#goldSpireGrad)" filter="url(#spireGlow)" />
  <polygon points="98,18 85,52 102,48" fill="#FFFBEB" opacity="0.4" />
</svg>
